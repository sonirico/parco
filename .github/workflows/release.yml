name: Release

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Read version from CHANGELOG
      id: version
      run: |
        tag=$(grep -m1 -oE '^## v[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | cut -c4-)
        test -n "$tag" || { echo "no '## vX.Y.Z' heading in CHANGELOG.md"; exit 1; }
        if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
          echo "$tag already tagged, nothing to release"
          echo "tag=" >> "$GITHUB_OUTPUT"
        else
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        fi

    - name: Extract changelog section
      if: steps.version.outputs.tag != ''
      run: |
        awk -v tag="${{ steps.version.outputs.tag }}" '
          $0 ~ "^## " tag " " { on = 1; next }
          on && /^## / { exit }
          on { print }
        ' CHANGELOG.md > notes.md
        test -s notes.md || { echo "empty CHANGELOG section"; exit 1; }

    - name: Tag and create GitHub release
      if: steps.version.outputs.tag != ''
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.version.outputs.tag }}
      run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md

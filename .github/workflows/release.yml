name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Extract changelog section
      run: |
        awk -v tag="${GITHUB_REF_NAME}" '
          $0 ~ "^## " tag " " { on = 1; next }
          on && /^## / { exit }
          on { print }
        ' CHANGELOG.md > notes.md
        test -s notes.md || { echo "no CHANGELOG section for ${GITHUB_REF_NAME}"; exit 1; }

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file notes.md
